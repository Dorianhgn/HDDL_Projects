# ResNet18 - Full Fine-tuning
# Train all parameters

model: models.classification_models.ResNetRegressor
model_args:
  architecture: resnet18
  freeze_strategy: none
  pretrained: true
  num_outputs: 4

task: box
criterion: MSELoss
epochs: 30
batch_size: 16
lr: 0.001
weight_decay: 0.0001

data_path: data/oxford-iiit-pet

data_args:
  - aug_percent: 0.5
  - train_test_split_ratio: 0.8
  - dataset_variant: custom
  - num_workers: 3

path: models/temp_results/boxes/resnet18_full_finetune/