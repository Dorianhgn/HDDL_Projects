# Option 2c: VGG16 Full Fine-tuning
# All parameters are trained (backbone + head)

model: models.classification_models.VGGRegressor
model_args:
  freeze_strategy: none
  pretrained: true
  num_outputs: 4

task: box
criterion: MSELoss
epochs: 30
batch_size: 16  # Smaller batch for full fine-tuning
lr: 0.0001  # Lower learning rate for fine-tuning
weight_decay: 0.0001

data_path: data/oxford-iiit-pet

data_args:
  - aug_percent: 0.5
  - train_test_split_ratio: 0.8
  - dataset_variant: custom
  - num_workers: 3

path: models/temp_results/boxes/vgg_full_finetune/
