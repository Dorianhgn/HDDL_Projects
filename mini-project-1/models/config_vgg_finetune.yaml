# Option 2c: Fine-tuning
# Parameters are trained (end backbone + head)

model: models.classification_binaire.MyVGGClassifier
model_args:
  finetune: True

task: classification
criterion: BCEWithLogitsLoss
epochs: 5
batch_size: 16  # Smaller batch for fine-tuning
lr: 0.0001  # Lower learning rate for fine-tuning
weight_decay: 0.0001

data_path: data/oxford-iiit-pet

data_args:
  - aug_percent: 0.5
  - train_test_split_ratio: 0.8
  - dataset_variant: custom
  - num_workers: 3

path: models/temp_results/classification/vgg_full_finetune/
