# =====================================================
# PHASE 1 : ENTRAÎNEMENT DE LA TÊTE UNIQUEMENT
# Backbone ResNet50 : GELÉ (freeze_backbone=True)
# Objectif : Stabiliser la nouvelle tête (2048→512→256→37)
# =====================================================

model: models.classification_models.ResNet50Pets
model_args:
  freeze_backbone: true  # ⚠️ BACKBONE GELÉ
  num_classes: 37

task: classification_fine
criterion: CrossEntropyLoss

epochs: 25  # Plus d'epochs car tête à 3 couches
batch_size: 32
lr: 0.001   # LR élevé OK (seule la tête s'entraîne)
weight_decay: 0.0001

data_path: data/oxford-iiit-pet

data_args:
  - aug_percent: 0.3  # Augmentation modérée
  - train_test_split_ratio: 0.8
  - dataset_variant: custom
  - num_workers: 4

path: models/temp_results/classification_fine/phase1_head_only/
